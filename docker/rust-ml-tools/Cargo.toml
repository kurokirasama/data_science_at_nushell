[package]
name = "rust-ml-tools"
version = "0.1.0"
edition = "2021"
authors = ["Data Science at Nushell <lgomez@ubiobio.cl>"]
description = "Pure-Rust standalone CLI tools for machine learning in Nushell pipelines"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smartcore = { version = "0.7.0", default-features = false, features = ["std"] }
linfa = "0.7.1"
linfa-clustering = "0.7.1"
linfa-reduction = "0.7.1"
ndarray = "0.15"
candle-core = "0.8.4"
candle-nn = "0.8.4"
burn = { version = "0.16.1", default-features = false, features = ["std", "train", "metrics"] }
burn-ndarray = "0.16.1"
rand = "0.8"

[[bin]]
name = "smartcore-cli"
path = "src/bin/smartcore_cli.rs"

[[bin]]
name = "linfa-cli"
path = "src/bin/linfa_cli.rs"

[[bin]]
name = "candle-cli"
path = "src/bin/candle_cli.rs"

[[bin]]
name = "burn-cli"
path = "src/bin/burn_cli.rs"

[[bin]]
name = "nutorch"
path = "src/bin/nutorch.rs"

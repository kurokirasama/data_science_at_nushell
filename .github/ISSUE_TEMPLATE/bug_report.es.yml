name: "🐛 Reporte de Error (Español)"
description: Reportar un fallo en una tubería de Nushell, comando CLI o entorno Docker
title: "[Error]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por tomarse el tiempo de reportar una incidencia en *Ciencia de Datos en la Terminal Linux con Nushell*!
  - type: dropdown
    id: component
    attributes:
      label: Componente Afectado
      description: ¿Qué parte del proyecto presenta el problema?
      options:
        - "Tubería / Comando Nushell (en el libro)"
        - "Contenedor Docker (dsin:latest)"
        - "Script en Python / R"
        - "Herramienta CLI de Modelado (vw, tapkee, skll)"
        - "Compilación Pandoc / PDF"
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Capítulo y Sección
      description: Ej: Capítulo 4: Crear Tuberías, Sección 4.3
      placeholder: "Capítulo 4, Sección 4.2"
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Comandos y Pasos para Reproducir
      description: ¿Qué comando o flujo ejecutó?
      placeholder: |
        1. Iniciar contenedor: docker run --rm -it ghcr.io/kurokirasama/dsin:latest nu
        2. Ejecutar comando: open data.csv | ...
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Mensaje de Error / Comportamiento Observado
      description: Pegue el mensaje de error exacto o salida obtenida.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento Esperado
      description: ¿Qué resultado esperaba obtener según la explicación del libro?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Información del Entorno
      description: Sistema Operativo, versión de Docker y versión de Nushell (`nu --version`).
      placeholder: "Ubuntu 24.04 / Docker 27.0.3 / Nushell 0.116.0"
    validations:
      required: false

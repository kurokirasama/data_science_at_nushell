name: "🐛 Bug Report (English)"
description: Report an error with a Nushell pipeline, CLI command, or Docker environment issue
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an error or issue in *Ciencia de Datos en la Terminal Linux con Nushell*!
        *Para reportar este error en español, utilice el formulario correspondiente.*
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: What part of the project is failing?
      options:
        - "Nushell Pipeline / Command (in Book)"
        - "Docker Container (dsin:latest)"
        - "Python / R Script"
        - "CLI Modeling Tool (vw, tapkee, skll)"
        - "Pandoc / PDF Build Script"
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter & Section
      description: E.g., Chapter 4: Crear Tuberías, Section 4.3
      placeholder: "Chapter 4, Section 4.2"
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Command & Steps to Reproduce
      description: What command or pipeline did you run?
      placeholder: |
        1. Start container: docker run --rm -it ghcr.io/kurokirasama/dsin:latest nu
        2. Run pipeline: open data.csv | ...
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Error Output / Actual Behavior
      description: Paste the exact error message or unexpected behavior observed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What output or behavior did you expect based on the book explanation?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Operating System, Docker version, and Nushell version (`nu --version`).
      placeholder: "Ubuntu 24.04 / Docker 27.0.3 / Nushell 0.116.0"
    validations:
      required: false

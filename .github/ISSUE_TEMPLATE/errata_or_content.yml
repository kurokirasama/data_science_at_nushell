name: "📖 Book Errata & Content (English)"
description: Report a typo, grammatical error, or pedagogical improvement in the book text
title: "[Errata]: "
labels: ["documentation", "errata"]
body:
  - type: markdown
    attributes:
      value: |
        Found a typo, incorrect explanation, or opportunity to improve pedagogical clarity in *Ciencia de Datos en la Terminal Linux con Nushell*? Let us know below!
        *Para reportar esta errata en español, utilice el formulario correspondiente.*
  - type: input
    id: location
    attributes:
      label: Location in Book
      description: Specify the Chapter, Section heading, or approximate PDF page number.
      placeholder: "Chapter 3: Obtener Datos, Section 3.2, PDF page 45"
    validations:
      required: true
  - type: textarea
    id: current_text
    attributes:
      label: Current Text / Phrasing
      description: Quote the exact excerpt containing the error or issue.
    validations:
      required: true
  - type: textarea
    id: proposed_text
    attributes:
      label: Proposed Correction
      description: How should the text read instead?
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: Rationale / Explanation
      description: Explain why this change improves technical accuracy or pedagogical clarity.
    validations:
      required: false
